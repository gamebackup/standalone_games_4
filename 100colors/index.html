<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Colors Guessing Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      color: #333;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-shadow: none;
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .speedrun-mode {
      margin: 10px 0;
      font-size: 14px;
    }

    .speedrun-mode label {
      cursor: pointer;
      user-select: none;
    }

    .timer-display {
      font-size: 20px;
      font-weight: bold;
      font-family: monospace;
      color: #007bff;
      margin: 10px 0;
    }

    .counter {
      font-size: 22px;
      font-weight: bold;
      color: #4a4a4a;
      margin: 10px 0 15px 0;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      height: 20px;
      font-size: 14px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .color-box {
      width: 100%;
      height: 160px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      transition: background-color 0.4s ease;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Guess 100 Colors</h1>
    
    <div class="speedrun-mode">
      <label>
        <input type="checkbox" id="speedrunToggle" /> Speedrun Mode
      </label>
      <div class="timer-display" id="timerDisplay" style="display: none;">00:00.00</div>
    </div>

    <div class="counter">Guessed: <span id="count">0</span> / 100</div>

    <div class="input-group">
      <input type="text" id="colorInput" placeholder="Enter color name..." />
      <button id="submitBtn">Submit</button>
    </div>

    <div class="message" id="message"></div>

    <div class="color-box" id="colorBox">Guess a color!</div>
  </div>

      "very light violet": "#CD66FF", "violet": "#8F00FF", "violet (purple)": "#926EAE", "violet blue": "#324AB2",
      "violet red": "#F75394", "viridian": "#40826D", "vivid burgundy": "#9F1D35", "vivid sky blue": "#00CCFF",
      "vivid tangerine": "#FFA089", "vivid violet": "#9F00FF", "walnut brown": "#432711", "warm black": "#004242",
      "wheat": "#F5DEB3", "white": "#FFFFFF", "wild blue yonder": "#A2ADD0", "wild orchid": "#D470A2",
      "wild strawberry": "#FF43A4", "wild watermelon": "#FC6C85", "willow green": "#999966", "windsor tan": "#A75502",
      "wine": "#722F37", "wisteria": "#C9A0DC", "xanadu": "#738678", "yale blue": "#0F4D92",
      "yellow": "#FFFF00", "yellow green": "#9ACD32", "yellow orange": "#FFAE42", "zaffre": "#0014A8",
      "zinnwaldite brown": "#2C1608"
    };

    const guessedColors = new Set();
    const input = document.getElementById("colorInput");
    const submitBtn = document.getElementById("submitBtn");
    const countDisplay = document.getElementById("count");
    const colorBox = document.getElementById("colorBox");
    const message = document.getElementById("message");
    const speedrunToggle = document.getElementById("speedrunToggle");
    const timerDisplay = document.getElementById("timerDisplay");

    let startTime = null;
    let timerInterval = null;

    speedrunToggle.addEventListener("change", () => {
      resetTimer();
      if (speedrunToggle.checked) {
        timerDisplay.style.display = "block";
      } else {
        timerDisplay.style.display = "none";
      }
    });

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      startTime = null;
      timerDisplay.textContent = "00:00.00";
    }

    function updateTimer() {
      if (!startTime) return;
      const elapsed = Date.now() - startTime;
      const totalSeconds = elapsed / 1000;
      const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const seconds = (totalSeconds % 60).toFixed(2).padStart(5, "0");
      timerDisplay.textContent = `${minutes}:${seconds}`;
    }

    function handleGuess() {
      const rawInput = input.value.trim().toLowerCase();

      if (!rawInput) return;

      if (guessedColors.has(rawInput)) {
        message.style.color = "#d9534f";
        message.textContent = `You already guessed "${rawInput}"!`;
      } else if (colors.hasOwnProperty(rawInput)) {
        guessedColors.add(rawInput);
        
        // Start Speedrun Timer on 1st valid submission
        if (speedrunToggle.checked && guessedColors.size === 1) {
          startTime = Date.now();
          timerInterval = setInterval(updateTimer, 10);
        }

        // Update Counter
        countDisplay.textContent = guessedColors.size;
        
        // Update Color Box
        const hex = colors[rawInput];
        colorBox.style.backgroundColor = hex;
        colorBox.textContent = rawInput.toUpperCase();
        
        // Feedback Message
        message.style.color = "#5cb85c";
        message.textContent = `Correct! Added ${rawInput}.`;

        // Stop Speedrun Timer on 100th valid submission
        if (guessedColors.size === 100) {
          if (speedrunToggle.checked && timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            updateTimer();
            message.style.color = "#0275d8";
            message.textContent = `Speedrun Complete! Final Time: ${timerDisplay.textContent}`;
          } else {
            message.style.color = "#0275d8";
            message.textContent = "Congratulations! You guessed 100 colors!";
          }
        }
      } else {
        message.style.color = "#d9534f";
        message.textContent = `"${rawInput}" is not in the color list.`;
      }

      input.value = "";
    }

    submitBtn.addEventListener("click", handleGuess);

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        handleGuess();
      }
    });
  </script>

</body>
</html>
