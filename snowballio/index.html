<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>snowball.io</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
        var kbKeys = {};
        var kbSpeed = 900;
        var kbPos = null;
        var kbActive = false;
        var kbRealMouse = null;
        var kbCanvas = null;
        var kbRafId = 0;

        window.addEventListener("mousemove", function (ev) {
            kbRealMouse = { x: ev.clientX, y: ev.clientY };
        }, true);

        window.addEventListener("keydown", function (ev) {
            var k = ev.key;
            if (k === "ArrowUp" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowRight" ||
                k === " " || k === "w" || k === "W" || k === "a" || k === "A" || k === "s" || k === "S" || k === "d" || k === "D") {
                if (ev.repeat) return;
                if (kbKeys[k]) return;
                ev.preventDefault();
                kbKeys[k] = true;
                if (!kbActive) {
                    kbActive = true;
                    if (kbPos === null) {
                        if (kbRealMouse) {
                            kbPos = { x: kbRealMouse.x, y: kbRealMouse.y };
                        } else {
                            kbPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                        }
                    }
                    kbCanvas = document.getElementById("gameContainer").getElementsByTagName("canvas")[0] || document.querySelector("canvas");
                    if (kbCanvas && kbRafId === 0) {
                        var last = performance.now();
                        (function loop(now) {
                            var dt = Math.min(0.05, (now - last) / 1000);
                            last = now;
                            var dx = 0, dy = 0;
                            if (kbKeys["ArrowUp"] || kbKeys["w"] || kbKeys["W"]) dy -= 1;
                            if (kbKeys["ArrowDown"] || kbKeys["s"] || kbKeys["S"]) dy += 1;
                            if (kbKeys["ArrowLeft"] || kbKeys["a"] || kbKeys["A"]) dx -= 1;
                            if (kbKeys["ArrowRight"] || kbKeys["d"] || kbKeys["D"]) dx += 1;
                            if (dx || dy) {
                                var len = Math.sqrt(dx * dx + dy * dy);
                                kbPos.x = Math.max(0, Math.min(window.innerWidth, kbPos.x + (dx / len) * kbSpeed * dt));
                                kbPos.y = Math.max(0, Math.min(window.innerHeight, kbPos.y + (dy / len) * kbSpeed * dt));
                                var c = kbCanvas;
                                if (c) {
                                    c.dispatchEvent(new MouseEvent("mousemove", {
                                        clientX: kbPos.x,
                                        clientY: kbPos.y,
                                        screenX: kbPos.x,
                                        screenY: kbPos.y,
                                        buttons: 0,
                                        bubbles: true,
                                        cancelable: true,
                                        view: window
                                    }));
                                }
                            }
                            if (kbActive) kbRafId = requestAnimationFrame(loop);
                        })(last);
                    }
                }
            }
        });

        window.addEventListener("keyup", function (ev) {
            var k = ev.key;
            if (kbKeys[k]) {
                ev.preventDefault();
                delete kbKeys[k];
            }
            var stillHeld = false;
            for (var kk in kbKeys) { if (kbKeys[kk]) { stillHeld = true; break; } }
            if (!stillHeld) {
                if (kbRafId) { cancelAnimationFrame(kbRafId); kbRafId = 0; }
                kbActive = false;
            }
        });
    </script>
    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/snowball-io-gd-v1_0.json", {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function () {
                    UnityProgress(gameInstance, "complete");
                }
            }
        });
    </script>
</head>

<body>
    <div id="gameContainer" style="width:100%;height:100%;"></div>
</body>

</html>
